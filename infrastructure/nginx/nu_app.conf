# nu_app のNginx設定（VPSのホストのNginx。D03）。`/etc/nginx/conf.d/nu_app.conf` に置く（http コンテキスト内）。
# 役割: TLS終端・リバースプロキシ・レート制限・リクエストサイズ制限。**認証・認可はしない**（Go APIが判断する）。
# 設計の要点:
#   - 公開サイト（nu-digital.jp）: GET/HEADだけ。APIは「アップロード画像の公開配信」`/api/v1/public/media/<22文字>`だけを中継し、
#     それ以外の `/api/` はサイトのホストから出さない（認証が要る経路・管理APIを公開ホストに出さない）。
#   - 管理（app.nu-digital.jp）: adminコンテナへ（adminが `/api/v1` をAPIへ中継する）。画像のアップロード上限に合わせて12MiB。
#   - **HTML・公開JSONをキャッシュしない**（`proxy_cache` を使わない・秒単位のmicrocacheも不可）。撤回・個人情報削除（D08）を次のリクエストから反映するため。
#   - クライアントIPは `$remote_addr` で**上書き**する（X-Forwarded-For を追記しない。偽装させない）。APIはこの値の右端を使う。
# 証明書: certbot（Ubuntuのパッケージ）の `/etc/letsencrypt/live/<ホスト名>/`。取得・更新・期限の監視は docs/OPERATIONS.md。

# アクセスログにはクエリ文字列を残さない（$uri はクエリを含まない）。IPは運用上の調査に使うため残し、Cookie・Authorization・本文は記録しない
log_format nu_app '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent "$http_user_agent" rt=$request_time';
access_log /var/log/nginx/nu_app.access.log nu_app;

limit_req_zone $binary_remote_addr zone=nu_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=nu_auth:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=nu_conn:10m;

# ---- HTTP: ACMEの確認以外はHTTPSへ ----
server {
    listen 80;
    listen [::]:80;
    server_name nu-digital.jp app.nu-digital.jp;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- 公開サイト ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nu-digital.jp;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/nu-digital.jp/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nu-digital.jp/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:nu_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    client_max_body_size 1k;
    limit_conn nu_conn 40;
    limit_req zone=nu_general burst=60 nodelay;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # アップロード画像の公開配信だけをAPIへ。Cookie・Authorizationは渡さない。proxy_passはURIなし（正規表現のlocation）
    location ~ "^/api/v1/public/media/[A-Za-z0-9_-]{22}$" {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_hide_header X-Powered-By;
    }
    # それ以外のAPIは、公開ホストからは見えない
    location /api/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header X-Powered-By;
    }
}

# ---- 管理（内部ポータル） ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.nu-digital.jp;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/app.nu-digital.jp/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.nu-digital.jp/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:nu_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # 画像のアップロード（最大10MiB）に余裕を持たせる。上限の検査・形式の検査はAPI側
    client_max_body_size 12m;
    limit_conn nu_conn 40;
    limit_req zone=nu_general burst=60 nodelay;

    # ログイン・招待・再設定は、Nginxでも回数を絞る（APIのレート制限に加えて）
    location ~ ^/api/v1/auth/(login|accept-invite|reset-password)$ {
        limit_req zone=nu_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header X-Powered-By;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering on;
        proxy_read_timeout 120s;
        proxy_hide_header X-Powered-By;
    }
}

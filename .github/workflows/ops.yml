name: ops

on:
  # baseがmain以外の積み重ねPRでもCIを実行する（docs/DEVELOPMENT.md「マージとレビューの運用」）
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ops-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backup:
    name: ops / backup-restore
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # バックアップ（DB+メディア・7世代・失敗通知）と、隔離環境への復元検証を、使い捨てのDBで実際に動かす（本番には何もしない）
      - run: scripts/backup-restore-test.sh

  nginx:
    name: ops / nginx
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 本番のNginx設定（infrastructure/nginx/nu_app.conf）を、使い捨てのNginxと擬似のバックエンドで実際に動かして確認する
      - run: scripts/nginx-test.sh
      # TLS証明書の期限確認（閾値・読めない・配信側の確認不能・通知に秘密を含めない）
      - run: scripts/cert-check-test.sh
      # 本番のCompose（compose.prod.yaml）が、雛形の設定で有効であること
      - run: docker compose --env-file .env.production.example -f infrastructure/compose.prod.yaml config -q
        env:
          NU_TAG: ci

  deploy-script:
    name: ops / deploy-script
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # デプロイスクリプト（infrastructure/deploy/deploy.sh）を、偽のdocker・curl・gitで確認する（本番には何もしない）
      - run: scripts/deploy-test.sh

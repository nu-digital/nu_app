name: web

on:
  # baseがmain以外の積み重ねPRでもCIを実行する（docs/DEVELOPMENT.md「マージとレビューの運用」）
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web / lint-typecheck-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm run web:ci
      - run: npm run web:lint
      - run: npm run web:typecheck
      - run: npm run test:unit
      - run: npm run web:build
      # 移設前基準(inventory.json)とのルート・記事・画像の一致
      - run: npm run web:verify
      # ブラウザー操作: 全ルート200・壊れた画像なし・ギャラリー(クリック/Enter/Space/左右/Esc/フォーカス復帰)・横溢れなし。
      # 画面画像の一致は、フォント・Chromium版に依存するためCIでは判定せず、ローカルで基準画像と比較する(docs/legacy-baseline)。
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run web:e2e
        env:
          PLAYWRIGHT_DIR: ${{ github.workspace }}/apps/web
          E2E_OUT_DIR: ${{ runner.temp }}/web-e2e
      # コンテナイメージ（nginx-unprivilegedで静的配信）がbuildできること
      - run: docker build -t nu_app-web:ci apps/web

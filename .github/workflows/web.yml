name: web

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'scripts/web-verify.mjs'
      - 'docs/legacy-baseline/inventory.json'
      - 'package.json'
      - '.github/workflows/web.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'scripts/web-verify.mjs'
      - 'docs/legacy-baseline/inventory.json'
      - 'package.json'
      - '.github/workflows/web.yml'

permissions:
  contents: read

concurrency:
  group: web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web / lint-typecheck-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm run web:ci
      - run: npm run web:lint
      - run: npm run web:typecheck
      - run: npm run test:unit
      - run: npm run web:build
      # 移設前基準(inventory.json)とのルート・記事・画像の一致。ブラウザー操作(ギャラリー等)はP0-02bでPlaywright固定後にCIへ追加する。
      - run: npm run web:verify

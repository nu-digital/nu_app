name: web

on:
  # baseがmain以外の積み重ねPRでもCIを実行する（docs/DEVELOPMENT.md「マージとレビューの運用」）
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web / lint-typecheck-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm run web:ci
      - run: npm run web:lint
      - run: npm run web:typecheck
      - run: npm run test:unit
      # 公開コンテンツは公開API（Go）から描画時に取得する動的配信。CIでは擬似の公開API（scripts/mock-public-api.mjs）と組み合わせる
      - run: npm run web:build
        env:
          API_INTERNAL_URL: http://127.0.0.1:18080
      # 移行CLIの正解（frontmatter・日付のゴールデン）が、記事の現状とずれていないこと
      - run: npm run web:goldens
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      # 起動したサイト（Next standalone）に対して: ①全ルート・記事・画像が移設前基準と一致 ②ブラウザー操作（全ルート200・壊れた画像なし・
      # ギャラリー・横溢れなし）③基準との指紋の比較（意図した差は docs/legacy-baseline/known-diffs.json に理由つき）④APIが使えないとき5xx・no-store
      # 画面画像の一致は、フォント・Chromium版に依存するためCIでは判定せず、ローカルで基準画像と比較する(docs/legacy-baseline)。
      - run: npm run web:site-check
        env:
          PLAYWRIGHT_DIR: ${{ github.workspace }}/apps/web
          E2E_OUT_DIR: ${{ runner.temp }}/web-e2e
      # コンテナイメージ（Next standalone）がbuildできること
      - run: docker build -t nu_app-web:ci apps/web

name: go

on:
  # baseがmain以外の積み重ねPRでもCIを実行する（docs/DEVELOPMENT.md「マージとレビューの運用」）
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: go-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go / ${{ matrix.module }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        module: [services/api, services/bot, services/agent]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: gofmt（差分があれば失敗）
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet -tags nodynamic ./...
      - run: go test -tags nodynamic -race -count=1 ./...
      - run: go build -tags nodynamic ./...

  images:
    name: go / docker build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: docker build -t nu_app-api:ci services/api
      - run: docker build -t nu_app-bot:ci services/bot
      - run: docker build -t nu_app-agent:ci services/agent
      - run: docker build -t nu_app-migrate:ci db

  sqlc:
    name: go / sqlc
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # 生成コード(services/api/internal/store)がSQLと一致していること
      - run: scripts/sqlc.sh diff

  integration:
    name: go / integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.7@sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a
        env:
          POSTGRES_PASSWORD: itest-only-not-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://postgres:itest-only-not-secret@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      # 実PostgreSQL 18.7に対する統合テスト（TEST_DATABASE_URL未設定なら失敗する。skipしない）
      - run: go test -tags integration,nodynamic -race -count=1 ./...
        working-directory: services/api
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: services/agent/go.mod
          cache-dependency-path: services/agent/go.sum
      # ぬる（services/agent）。agentスキーマの実際のmigrationに対する統合テスト
      - run: go test -tags integration -race -count=1 ./...
        working-directory: services/agent

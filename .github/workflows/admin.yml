name: admin

on:
  # baseがmain以外の積み重ねPRでもCIを実行する（docs/DEVELOPMENT.md「マージとレビューの運用」）
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: admin-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  admin:
    name: admin / lint-typecheck-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm run admin:ci
      - run: npm run admin:lint
      - run: npm run admin:typecheck
      # プレビューの描画時サニタイズ（共有の事例集・既存67記事・攻撃的な入力）
      - run: npm run admin:test
      - run: npm run admin:build
      - run: npm audit --prefix apps/admin
      - run: docker build -t nu_app-admin:ci apps/admin

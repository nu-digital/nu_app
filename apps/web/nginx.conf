# 静的export用。trailingSlash:true のため /blog/ のようなディレクトリURLを index.html として返す。
# URLの大文字小文字・ドットはそのまま扱う（正規化しない）。
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
}
